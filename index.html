<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>मेरा पहला पेज</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #f0f4f8;
      color: #333;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      transition: 0.3s;
    }

    h1 {
      color: #2b6cb0;
    }

    h2 {
      color: #444;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    .card {
      background-color: white;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      max-width: 350px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    a {
      color: #2b6cb0;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      color: orange;
    }

    .pura {
      text-decoration: line-through;
      color: gray;
    }

    .pura::before {
      content: "✓ ";
      color: green;
    }

    li {
      cursor: pointer;
      padding: 5px;
    }

    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 16px;
      margin: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1e4e8c;
    }

    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      max-width: 100%;
    }

    /* Dark Mode */

    body.dark {
      background-color: #1a202c;
      color: #e2e8f0;
    }

    body.dark .card {
      background-color: #2d3748;
    }

    body.dark h1,
    body.dark a {
      color: #90cdf4;
    }

    body.dark h2 {
      color: #e2e8f0;
    }

    /* Mobile Design */

    @media (max-width: 480px) {
      body {
        padding: 10px;

</body>
</html>
