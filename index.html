<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
}

:root {
  --bg: #08111f;
  --card: #111f33;
  --text: #f1f5f9;
  --blue: #38bdf8;
  --muted: #a8b7ca;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  line-height: 1.6;
  transition: .3s;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: -50%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 25% 35%, #1749a8 0%, transparent 35%),
    radial-gradient(circle at 75% 60%, #6425a5 0%, transparent 35%),
    radial-gradient(circle at 50% 15%, #087b91 0%, transparent 35%);
  filter: blur(65px);
  opacity: .65;
  animation: glowingMove 14s ease-in-out infinite alternate;
}

@keyframes glowingMove {
  0% {
    transform: translate(-4%, -3%) scale(1);
  }
  100% {
    transform: translate(4%, 3%) scale(1.15);
  }
}

body.light {
  --bg: #f0f5fb;
  --card: #ffffff;
  --text: #172033;
  --muted: #526176;
}

nav {

  z-index: 10;

}

.logo {

}

nav a:hover {
  color: var(--blue);
}

  font-weight: bold;
  cursor: pointer;
  margin: 5px;
  transition: .2s;
}

button:hover {
  transform: translateY(-3px);
  filter: brightness(1.1);
}

.hero {
  min-height: 75vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background:
    radial-gradient(circle at 50% 30%, #0c4a6e66, transparent 55%);
}

}

.profile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hero h1 {
  font-size: clamp(32px, 6vw, 55px);
  margin-bottom: 10px;
}

.hero h1 span {
  color: var(--blue);
}

.hero p {
  color: var(--muted);

}

.section {
  padding: 65px 8%;

}

}

  color: var(--blue);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  max-width: 1000px;
  margin: auto;
}

.card {
  background: var(--card);
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #38bdf822;
  transition: .3s;
  text-align: left;
}

.card:hover {
  transform: translateY(-6px);
  border-color: var(--blue);
}

.card h3 {
  color: var(--blue);
  margin-bottom: 10px;
}

.card p {
  color: var(--muted);
}

input {
  padding: 12px;
  width: 100%;

  border-radius: 8px;
  margin: 6px;
  font-size: 16px;
}

.result {
  color: var(--blue);
  font-size: 20px;
  margin-top: 12px;
}

  padding: 10px;
  border-radius: 8px;
  margin: 8px 0;
  cursor: pointer;
  overflow-wrap: anywhere;
}
