<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>मेरा पहला पेज</title>
  <style>
    body {
      background-color: #f0f4f8;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #2b6cb0;
    }
    h2 {
      color: #444;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    .card {
      background-color: white;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      max-width: 300px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    a {
      color: #2b6cb0;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      color: orange;
    }
  </style>
</head>
<body>
  <h1>नमस्ते, मैं हिम्मत मीना हूँ</h1>
  <p>मैं वेब डेवलपर बनना सीख रहा हूँ।</p>

  <div class="card">
    <h2>मेरे शौक</h2>
    <ul>
      <li>क्रिकेट</li>
      <li>गाने सुनना</li>
    </ul>
  </div>

  <div class="card">
    <h2>मेरा लक्ष्य</h2>
    <p>वेब डेवलपर बनना</p>
  </div>

  <h2>मेरे पसंदीदा लिंक</h2>
  <p><a href="https://www.freecodecamp.org">freeCodeCamp पर जाओ</a></p>

  <div class="card">
    <h2>गिनती</h2>
    <p id="ginti">0</p>
    <button onclick="badhao()">+1</button>
    <button onclick="ghatao()">-1</button>
    <button onclick="reset()">रीसेट</button>
  </div>

  <div class="card">
    <h2>अपना नाम लिखो</h2>
    <input type="text" id="naam" placeholder="यहाँ नाम लिखो">
    <br><br>
    <button onclick="namaste()">नमस्ते बोलो</button>
    <p id="jawab"></p>
  </div>

  <div class="card">
    <h2>मेरे काम</h2>
    <input type="text" id="kaam" placeholder="नया काम लिखो">
    <button onclick="kaamJodo()">जोड़ो</button>
    <ul id="suchi"></ul>
  </div>

  <script>
    let count = 0;

    function badhao() {
      count = count + 1;
      document.getElementById('ginti').innerText = count;
    }

    function ghatao() {
      count = count - 1;
      document.getElementById('ginti').innerText = count;
    }

    function reset() {
      count = 0;
      document.getElementById('ginti').innerText = count;
    }

    function namaste() {
      let naam = document.getElementById('naam').value;

      if (naam == '') {
        document.getElementById('jawab').innerText = 'पहले अपना नाम लिखो!';
      } else {
        document.getElementById('jawab').innerText = 'नमस्ते ' + naam + '!';
      }
    }

    function kaamJodo() {
      let kaam = document.getElementById('kaam').value;

      if (kaam == '') {
        return;
      }

      let item = document.createElement('li');
      item.innerText = kaam;
      document.getElementById('suchi').appendChild(item);

      document.getElementById('kaam').value = '';
    }
  </script>
</body>
    </html>
