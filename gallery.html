
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>मेरी फोटो गैलरी</title>

  <style>
    body {
      background-color: #f0f4f8;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #2b6cb0;
    }

    .slider {
      max-width: 500px;
      margin: 25px auto;
      position: relative;
    }

    .slider img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.2);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 15px;
    }

    button {
      background: #2b6cb0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .dots {
      margin: 12px;
    }

    .dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      margin: 5px;
      border-radius: 50%;
      background: #aaa;
      cursor: pointer;
    }

    .dot.active {
      background: #2b6cb0;
    }

    a {
      color: #2b6cb0;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h1>मेरी फोटो गैलरी 📸</h1>

  <div class="slider">
    <img id="slideImage" src="DSC_2065-2.JPG" alt="मेरी फोटो">
    
    <div class="controls">
      <button onclick="previousPhoto()">❮ Previous</button>
      <button onclick="nextPhoto()">Next ❯</button>
    </div>

    <div class="dots" id="dots"></div>
  </div>

  <p><a href="index.html">← वापस मुख्य पेज</a></p>

  <script>
    const photos = [
      "DSC_2065-2.JPG",
      "DSC_2067-2.JPG",
      "IMG_20260926_173817.jpg",
      "IMG_5103.JPG"
    ];

    let currentPhoto = 0;
    const slideImage = document.getElementById("slideImage");
    const dotsContainer = document.getElementById("dots");

    function showPhoto() {
      slideImage.src = photos[currentPhoto];

      dotsContainer.innerHTML = "";

      photos.forEach((photo, index) => {
        const dot = document.createElement("span");
        dot.className = "dot";

        if (index === currentPhoto) {
          dot.classList.add("active");
        }

        dot.onclick = function() {
          currentPhoto = index;
          showPhoto();
        };

        dotsContainer.appendChild(dot);
      });
    }

    function nextPhoto() {
      currentPhoto = (currentPhoto + 1) % photos.length;
      showPhoto();
    }

    function previousPhoto() {
      currentPhoto =
        (currentPhoto - 1 + photos.length) % photos.length;
      showPhoto();
    }

    showPhoto();

    setInterval(nextPhoto, 3000);
  </script>

</body>
  </html>
