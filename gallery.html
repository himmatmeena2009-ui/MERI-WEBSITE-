
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Himmat - My Photo Gallery</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  padding: 30px 15px;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background:
    radial-gradient(circle at top left, #a000ff, transparent 35%),
    radial-gradient(circle at bottom right, #006aff, transparent 35%),
    linear-gradient(135deg, #08051f, #10104b, #08051f);
  overflow-x: hidden;
}

.header {
  margin: 20px auto 35px;
}

.camera {
  font-size: 45px;
  filter: drop-shadow(0 0 12px #00eaff);
}

h1 {
  font-size: clamp(28px, 7vw, 48px);
  margin: 12px 0;
  background: linear-gradient(90deg, #ff70e8, #71eaff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 0 0 25px #8b5cff55;
}

.subtitle {
  color: #d9d5ff;
  font-size: 16px;
  letter-spacing: 1px;
}

.line {
  width: 150px;
  height: 3px;
  margin: 18px auto;
  background: linear-gradient(90deg, #ff00e6, #00eaff);
  border-radius: 10px;
  box-shadow: 0 0 12px #00eaff;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  max-width: 750px;
  margin: auto;
}

.photo-card {
  padding: 7px;
  border-radius: 20px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.35);
  backdrop-filter: blur(12px);
  box-shadow: 0 0 18px #7c4dff55;
  transition: 0.3s;
}

.photo-card img {
  width: 100%;
  height: 190px;
  display: block;
  object-fit: cover;
  border-radius: 14px;
}

.photo-card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 0 25px #00d9ff99;
  border-color: #00eaff;
}

.last-photo {
  grid-column: 1 / -1;
}

.back {
  display: inline-block;
  margin: 35px auto 20px;
  padding: 14px 28px;
  color: white;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
  border-radius: 30px;
  background: linear-gradient(90deg, #a000ff, #007bff);
  box-shadow: 0 0 20px #8b5cff99;
  transition: 0.3s;
}

.back:hover {
  transform: scale(1.06);
  box-shadow: 0 0 28px #00eaff;
}

footer {
  color: #c9c5ff;
  margin-top: 15px;
  font-size: 14px;
}

@media (max-width: 420px) {
  .grid {
    gap: 10px;
  }

  .photo-card img {
    height: 145px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="camera">📸</div>
  <h1>My Photo Gallery</h1>
  <p class="subtitle">✨ Capture The Beautiful Moments ✨</p>
  <div class="line"></div>
  <p>💜 Welcome to My Gallery 💙</p>
</div>

<div class="grid">

  <div class="photo-card">
    <img src="DSC_2065-2.JPG" alt="Photo 1" loading="lazy">
  </div>

  <div class="photo-card">
    <img src="DSC_2067-2.JPG" alt="Photo 2" loading="lazy">
  </div>

  <div class="photo-card">
    <img src="FB_IMG_1786619245072.jpg" alt="Photo 3" loading="lazy">
  </div>

  <div class="photo-card">
    <img src="FB_IMG_1786619249758.jpg" alt="Photo 4" loading="lazy">
  </div>

  <div class="photo-card">
    <img src="FB_IMG_1786619254931.jpg" alt="Photo 5" loading="lazy">
  </div>

  <div class="photo-card">
    <img src="IMG_20260926_173817.jpg" alt="Photo 6" loading="lazy">
  </div>

  <div class="photo-card last-photo">
    <img src="IMG_5103.JPG" alt="Photo 7" loading="lazy">
  </div>

</div>

<a class="back" href="index.html">← Back to Home</a>

<footer>
  Made with ❤️ by Himmat
</footer>

</body>
    </html>
