<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>मेरी फोटो गैलरी</title>
  <style>
    body {
      background-color: #f0f4f8;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #2b6cb0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 500px;
      margin: 20px auto;
    }
    .grid img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    a {
      color: #2b6cb0;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>मेरी फोटो गैलरी</h1>

  <div class="grid">
    <img src="DSC_2065-2.JPG" loading="lazy" alt="फोटो 1">
    <img src="DSC_2067-2.JPG" loading="lazy" alt="फोटो 2">
    <img src="FB_IMG_1786619245072.jpg" loading="lazy" alt="फोटो 3">
    <img src="FB_IMG_1786619249758.jpg" loading="lazy" alt="फोटो 4">
    <img src="FB_IMG_1786619254931.jpg" loading="lazy" alt="फोटो 5">
    <img src="IMG_20260926_173817.jpg" loading="lazy" alt="फोटो 6">
    <img src="IMG_5103.JPG" loading="lazy" alt="फोटो 7">
  </div>

  <p><a href="index.html">← वापस मुख्य पेज</a></p>

</html>
